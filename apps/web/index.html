<!doctype html>
<html lang="en" data-appearance-enabled="%VITE_FEATURE_APPEARANCE%" data-appearance-storage-key="gigloop-appearance">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GigLoop</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Commissioner:wght@100..900&family=Lexend+Deca:wght@100..900&family=Major+Mono+Display&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <script id="appearance-bootstrap">
      (() => {
        const root = document.documentElement;
        const enabled = ['true', '1'].includes((root.dataset.appearanceEnabled || '').trim().toLowerCase());
        let preference = 'system';
        try {
          const stored = window.localStorage.getItem(root.dataset.appearanceStorageKey || 'gigloop-appearance');
          if (stored === 'system' || stored === 'light' || stored === 'dark') preference = stored;
        } catch {
          // An unavailable or unreadable preference falls back to System.
        }
        const pathname = window.location.pathname;
        const isPortal = pathname.startsWith('/booking/') || pathname.startsWith('/band/');
        const isAdmin = pathname === '/admin' || pathname.startsWith('/admin/') || pathname.startsWith('/onboarding/');
        const systemDark = enabled && isAdmin && preference === 'system'
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : false;
        const dark = enabled && isAdmin && !isPortal && (preference === 'dark' || (preference === 'system' && systemDark));
        root.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
