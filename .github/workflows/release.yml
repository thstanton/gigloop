name: Release

# Production release (ADR-0044 §4, PRD #436, issue #442). Prod deploys ONLY
# via `workflow_dispatch` — merges to `main` never deploy prod, and neither
# does pushing a tag by hand. This is the first pipeline that touches real
# prod data: HITL for the first releases (a human watches the run, not just
# merges the PR).
#
# Triggered exclusively by `promote.yml` (issue #908), which validates the
# target commit, creates+pushes the `v*` tag, then dispatches this workflow
# `--ref <that tag>` — so `github.ref_name` below is already the tag by the
# time this job starts, with no separate tag input needed. Deliberately
# NOT also triggered by `on: push: tags:` — a tag pushed by promote.yml's
# GITHUB_TOKEN wouldn't reliably re-trigger via a push event anyway (GitHub
# suppresses workflow runs triggered by a GITHUB_TOKEN-authored push, to
# prevent trigger loops), and keeping both trigger types would risk two
# concurrent runs racing the same prod migration and Neon snapshot branch
# for one tag — a single trigger path removes that risk entirely rather
# than relying on unverified suppression behaviour.
#
# Fixed, data-protecting step order: snapshot -> migrate -> deploy API ->
# deploy web. Deliberately NO `continue-on-error` anywhere in this job — a
# failed step must halt the run before deploying code against an
# un/partly-migrated prod database. Contrast with migration-rehearsal.yml,
# which uses continue-on-error because it always deletes its branch
# regardless of outcome; this workflow's Neon branch is the opposite of
# that — a durable rollback target that must survive the run, so it is
# never deleted by the run that created it. Older snapshots ARE pruned, by
# a step that runs before the snapshot; see its comment.
#
# Prerequisites this workflow depends on but does not itself configure.
# Branch auto-deploy is now DISABLED on both prod services (confirmed
# 2026-08-19), so the tag really is the only path to prod — see
# docs/environments.md. Preprod is the mirror of this workflow (ADR-0075):
#   - Railway prod environment: branch auto-deploy disabled  [done]
#   - Vercel prod project: branch auto-deploy disabled for `main`  [done]
#   - Repo secrets: PROD_DATABASE_URL, RAILWAY_PROD_TOKEN, VERCEL_TOKEN,
#     VERCEL_ORG_ID, VERCEL_PROJECT_ID
#     PROD_DATABASE_URL MUST be the DIRECT (non-pooled) Neon string — host
#     WITHOUT `-pooler`, no `pgbouncer=true` — with `connect_timeout=15`.
#     `prisma migrate deploy` (below) takes a session-level advisory lock that
#     transaction-mode pooling breaks, and it is the first step to touch the
#     prod compute, which scale-to-zeros pre-launch (#612) — a cold resume
#     exceeds Prisma's 5s default, so a generous connect_timeout is required.
#     The schema's datasource reads `directUrl` (= DIRECT_URL) for migrations.
#   - Repo variables: RAILWAY_PROD_PROJECT_ID, RAILWAY_PROD_ENVIRONMENT,
#     RAILWAY_PROD_SERVICE
#     (NEON_API_KEY secret + NEON_PROD_PROJECT_ID variable already exist,
#     reused from migration-rehearsal.yml)
on:
  workflow_dispatch:

# A second tag pushed mid-release must not race this one against prod.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # Native GitHub Actions environment tracking (issue #907): declaring
    # `environment:` records a Deployment against this environment when the
    # job starts and sets its status to success/failure from the job outcome
    # — no extra API calls needed. This run is tag-triggered, so the
    # deployment's ref is the tag itself (e.g. `v0.6.0`), not a bare SHA.
    # Shows up under repo → Environments → `prod`.
    environment:
      name: prod
      url: https://www.gigloop.co.uk
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.3'
      - uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
      - run: bun install --frozen-lockfile
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Prune old pre-release Neon branches
        # The prod Neon project has a hard cap on branch count and nothing
        # here ever removed one, so every release added a branch until the
        # v0.9.0 run hit the ceiling and create-branch-action failed with a
        # bare `422` (the action discards the response body, so the log gave
        # no reason). Keep the most recent KEEP snapshots as rollback targets
        # and delete the rest, so the create below always has room. KEEP is
        # set two below the cap on purpose: migration-rehearsal.yml creates
        # its scratch branch in this same project, so a rehearsal running
        # near a release transiently occupies a slot, and a prune that freed
        # exactly one would fail the release intermittently.
        #
        # Deliberately no `continue-on-error` (see the header note): a prune
        # failure must halt the run, and it does so before any step touches
        # the prod database.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROD_PROJECT_ID }}
          KEEP: '3'
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $NEON_API_KEY" "$@"; }
          base="https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches"

          # Ordered by created_at, never by name: a name sort breaks the
          # moment v0.10.0 exists (lexically it precedes v0.9.0) and the
          # prune would then delete the newest snapshot instead of the oldest.
          doomed="$(api "$base" | jq -r --argjson keep "$KEEP" '
            [ .branches[]
              | select(.name | startswith("pre-release-"))
              | select(.default != true) ]
            | sort_by(.created_at)
            | (length - $keep) as $excess
            | (if $excess <= 0 then [] else .[0:$excess] end)
            | .[] | "\(.id) \(.name)"')"

          if [ -z "$doomed" ]; then
            echo "Nothing to prune — at most $KEEP pre-release branches exist."
            exit 0
          fi

          while read -r id name; do
            echo "Deleting $name ($id)"
            api -X DELETE "$base/$id" > /dev/null
          done <<< "$doomed"

      - name: Snapshot prod — create durable pre-release Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROD_PROJECT_ID }}
          branch_name: pre-release-${{ github.ref_name }}
          # No delete-branch-action step for this branch: it is the
          # rollback target (ADR-0044 §6), not an ephemeral scratch branch.

      - name: Generate Prisma client
        run: cd apps/api && bunx prisma generate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Migrate prod database
        # Consumes DIRECT_URL (schema datasource `directUrl`). PROD_DATABASE_URL
        # must be the direct/non-pooled string — see header note on the secret.
        run: cd apps/api && bunx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Deploy API to Railway (prod)
        run: |
          bunx @railway/cli@latest up \
            --service "${{ vars.RAILWAY_PROD_SERVICE }}" \
            --project "${{ vars.RAILWAY_PROD_PROJECT_ID }}" \
            --environment "${{ vars.RAILWAY_PROD_ENVIRONMENT }}" \
            -m "release ${{ github.ref_name }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_TOKEN }}

      # Build ON Vercel's infra (remote), not in this runner. The prior
      # `vercel pull -> build -> deploy --prebuilt` built in-runner, so it
      # depended on `vercel pull` returning every build-time var — but Vercel
      # deliberately withholds the plaintext of **Sensitive** env vars from
      # `pull`, so the CI build baked our `VITE_*` client keys as empty strings.
      # An empty VITE_CLERK_PUBLISHABLE_KEY makes Clerk build a hostless loader
      # URL (`https:///npm/...`) and the whole prod frontend fails to init.
      # A remote build runs where Sensitive plaintext IS available (identical to
      # the preprod git-integration build that never had this problem), so the
      # keys bake correctly with no change to the Vercel dashboard.
      - name: Deploy web to Vercel (prod) — remote build so Sensitive vars bake in
        run: bunx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke-check Clerk key is live on the production site
        # A LOUD post-deploy alarm, not a pre-promote gate. We can't verify the
        # bare *.vercel.app deployment URL — Vercel deployment protection 401s
        # it — so we check the PUBLIC custom domain after it goes live. If this
        # fails the build is live but broken: roll back with
        # `vercel promote <previous-good-deployment-url>` (the kept pre-release
        # Neon branch is unaffected — this is a web-only rollback).
        run: |
          for attempt in 1 2 3 4 5 6; do
            html="$(curl -fsSL https://www.gigloop.co.uk/admin || true)"
            for chunk in $(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js'); do
              if curl -fsSL "https://www.gigloop.co.uk$chunk" | grep -q 'pk_live_'; then
                echo "Clerk publishable key is live in $chunk"
                exit 0
              fi
            done
            echo "Clerk key not visible yet (attempt $attempt/6) — waiting for alias propagation…"
            sleep 10
          done
          echo "::error::Production bundle at www.gigloop.co.uk has no pk_live_ Clerk key — Clerk is broken. Roll back with: vercel promote <previous-good-deployment-url>"
          exit 1

      - name: Smoke-check production API host is live on the production site
        # Sibling to the Clerk-key check above (#865) — the same white-screen
        # risk applies to VITE_API_BASE_URL: resolveApiBaseUrl
        # (apps/web/src/lib/apiBaseUrl.ts) fails closed at runtime, in the
        # browser, not at build time, so an empty or wrong value used to sail
        # past this gate as long as the Clerk key was present. Own fetch/retry
        # loop and own message, deliberately not folded into the step above,
        # so neither check can mask the other's failure. Host-matching logic
        # lives in scripts/verify-prod-api-host.mjs (unit-tested in CI) — this
        # step only owns the fetch/retry loop, mirroring the Clerk check.
        run: |
          last_reason=""
          for attempt in 1 2 3 4 5 6; do
            html="$(curl -fsSL https://www.gigloop.co.uk/admin || true)"
            bundle=""
            for chunk in $(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js'); do
              bundle="$bundle$(curl -fsSL "https://www.gigloop.co.uk$chunk" || true)"
            done
            if output="$(printf '%s' "$bundle" | node scripts/verify-prod-api-host.mjs 2>&1)"; then
              echo "$output"
              exit 0
            fi
            last_reason="$output"
            echo "Production API host not confirmed yet (attempt $attempt/6): $last_reason — waiting for alias propagation…"
            sleep 10
          done
          echo "::error::Production bundle at www.gigloop.co.uk does not reference the production API host: $last_reason. Roll back with: vercel promote <previous-good-deployment-url>"
          exit 1

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release ${{ github.ref_name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pre-release Neon branch | \`pre-release-${{ github.ref_name }}\` (kept — rollback target, ADR-0044 §6) |"
            echo "| Job result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
